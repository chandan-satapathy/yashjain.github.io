<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') || 'light';
      } catch (_) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yash Jain</title>
  <meta name="description"
    content="Yash Jain — Management Consultant, Writer, and Explorer." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">

  <!-- ═══ NAV ═══ -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">Yash Jain</a>

    <div class="nav-right">
      <div class="nav-links">
        <a href="index.html"      data-nav="home">Home</a>
        <a href="work.html"       data-nav="work">Work</a>
        <a href="blog/index.html" data-nav="blog-index">Blog</a>
        <a href="https://www.linkedin.com/in/yash-jain-02a8b918b/"
          target="_blank" rel="noopener noreferrer"
          class="hero-linkedin">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>
      </div>

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22"   x2="5.64"  y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1"  y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36"/>
          <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <button class="hamburger" id="hamburger" aria-label="Open menu"
        aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile nav drawer -->
  <div class="nav-mobile" id="navMobile">
    <a href="index.html"      data-nav="home">Home</a>
    <a href="work.html"       data-nav="work">Work</a>
    <a href="blog/index.html" data-nav="blog-index">Blog</a>
    <a href="contact.html"    data-nav="contact">Contact</a>
  </div>

  <!-- ═══ MAIN ═══ -->
  <main>
    <div class="container">
      <section class="hero">

        <!-- Avatar placeholder — replace initials with <img> once photo is ready -->
        <div class="hero-avatar">
           <img src="assets/photo.jpg" alt="Yash Jain" />
        </div>

        <!-- Typewriter line — text loaded from data/home.md frontmatter -->
        <h1 class="hero-tagline">
          <span id="typewriter"></span><span class="cursor"></span>
        </h1>

        <!-- Bio — rendered from data/home.md body (markdown with links) -->
        <div class="hero-bio fade-in" id="heroBio" style="animation-delay: 0.2s"></div>

        <!-- Quote — rendered from data/home.md frontmatter -->
        <div class="hero-quote fade-in" style="animation-delay: 0.4s">
          <blockquote id="heroQuote"></blockquote>
          <cite id="heroQuoteAuthor"></cite>
        </div>

        <!-- Section navigation cards -->
        <div class="home-sections fade-in" style="animation-delay: 0.6s">
          <a href="work.html" class="home-section-card">
            <div class="home-section-card-title">Work &rarr;</div>
            <div class="home-section-card-desc">Consulting, VC &amp; strategy</div>
          </a>
          <a href="blog/index.html" class="home-section-card">
            <div class="home-section-card-title">Blog &rarr;</div>
            <div class="home-section-card-desc">Essays &amp; life stories</div>
          </a>
        </div>


      </section>
    </div>
  </main>

  <!-- ═══ FOOTER ═══ -->
  <footer>
    <span class="footer-name">Yash Jain</span>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="work.html">Work</a>
      <a href="blog/index.html">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="https://www.linkedin.com/in/yash-jain-02a8b918b/"
        target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>
    <span class="footer-copy">
      © <span id="footerYear"></span> Yash Jain. All rights reserved.
    </span>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
